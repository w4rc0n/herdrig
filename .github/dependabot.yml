# Dependabot version updates for herdrig.
# The workflows pin each action by commit SHA with its version in a comment; Dependabot updates both.
# There is no npm entry: herdrig ships no package.json (the mods have no dependencies). Add one with the first manifest.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
